name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
      - "macbook兼容版"
      - "Ruby"

jobs:
  build-windows-release:
    name: Build Windows Release Package
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Run tests (informational, won't block build)
        shell: pwsh
        continue-on-error: true
        run: python -m unittest discover -s tests -v 2>&1 || echo "测试未全部通过（源码尚在开发中）"

      - name: Build Windows package
        shell: pwsh
        run: python build_exe.py

      - name: Show release files
        shell: pwsh
        run: |
          Get-ChildItem -Path release -Recurse |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.ref_name }}-${{ github.run_number }}
          path: release/**
          if-no-files-found: error
          retention-days: 14
